<style>
    html {
        width: 100%;
    }
    body {
        background-color: rgb(31, 32, 36);
        color:cadetblue;
        display: flex;
        align-items: center;
        flex-direction: column;
    }
    #grid {
        width: 230px;
        height: 210px;
        display: flex;
        flex-wrap: wrap;
    }

    .grid-space {
        border: 1px solid grey;
        background-color: rgb(31, 32, 36);
        width: 20px;
        height: 20px;
    }

    .snaky {
        background-color: red;
    }

    .apple {
        background-color: green;
    }
</style>

<div id="grid"></div>
<div style="margin-top: 20px">
    <button id="up">Up</button>
    <button id="down">Down</button>
    <button id="left">Left</button>
    <button id="right">Right</button>
    <button id="startGame">Start Over</button>

    <p>PTS:</p>
    <p id="pts"></p>
</div>

<script>
    /* 
        TODO:
        Update the code here to make the snake game work
        The snake should be able to change directions
        There should always be an apple present within the board
        If the snake eats an apple, a new apple should be randomly placed on the board
        Every time an apple is "eaten" - a point should be added to the score
        Starting the game over should reset the points, move the snake back to its original positions and clear all apples
    */
    const grid = document.getElementById('grid');
    // buttons
    const startGameBtn = document.getElementById('startGame');
    const upBtn = document.getElementById('up');
    const downBtn = document.getElementById('down');
    const leftBtn = document.getElementById('left');
    const rightBtn = document.getElementById('right');
    const pointsDiv = document.getElementById('pts');
    
    let direction = "right";
    let pts = 0;
    let row = 0;
    let snake = [0, 1, 2];
    let moveSnake  = null
    let apple = null
    

    const createBoard = () => {
        for (let i = 0; i < 100; i++) {
            const div = document.createElement('div');
            div.classList.add('grid-space');
            grid.appendChild(div);
        }
    };
    // create board

    startGameBtn.addEventListener('click', () => {
        // add your code here
        grid.innerHTML = "";
        direction = "right";
        pts = 0;
        row = 0;
        snake = [0, 1, 2];
        clearInterval(moveSnake);
        startGame();
    });

    upBtn.addEventListener('click', () => {
        direction = "up";
    });

    downBtn.addEventListener('click', () => {
        direction = "down";
    });

    leftBtn.addEventListener('click', () => {
        direction = "left";
    });

    rightBtn.addEventListener('click', () => {
        direction = "right";
    });

    function drawSnake(grid, tail = 0) {
        grid[tail].classList.remove("snaky");
        snake.forEach((s) => {
            grid[s].classList.add("snaky");
        });
    }

    function drawApple(grid) {
        const position = Math.trunc(Math.random() * 100)
        apple = position
        grid[position].classList.add("apple");
    }

    function removeApple(grid, pos) {
        grid[pos].classList.remove("apple");
    }

    const startGame = () => {
        createBoard()
        const allGridElems = document.querySelectorAll('.grid-space');
        drawApple(allGridElems)
        drawSnake(allGridElems, 0)
        

        moveSnake = setInterval(() => {
            // add code here to move snake
            
            let tail = snake[0]

            let currentSnake = [...snake]
            let nextHead = currentSnake[2]

            switch(direction) {
                case "down": 
                    nextHead = nextHead + 10
                    break;
                case "up":
                    nextHead = nextHead - 10
                    break;
                case "left":
                    nextHead = --nextHead
                    break;
                case "right":
                    nextHead = ++nextHead
                    break;
                default:
                    nextHead = ++nextHead
            }

            let nextSnake = [currentSnake[1], currentSnake[2], nextHead]
            
            snake = [nextSnake[0], nextSnake[1], nextSnake[2]]
            drawSnake(allGridElems, tail)

            if(nextHead === apple) {
                removeApple(allGridElems, apple)
                drawApple(allGridElems)
                pts++
            }
            pointsDiv.innerText = pts
        }, 1000);
    };

    createBoard()
</script>
